name: Publish images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            image: aurasync-backend
          - name: web
            context: ./frontend
            image: aurasync-web
          - name: openrgb
            context: ./docker/openrgb
            image: aurasync-openrgb
    steps:
      - uses: actions/checkout@v4

      - name: Prepare version and registry owner
        id: prep
        run: |
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OPENRGB_REF=release_1.1
          tags: |
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/${{ matrix.image }}:${{ steps.prep.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/${{ matrix.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.prep.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  digest:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Print deployment reminder
        run: |
          echo "Images published for tag ${GITHUB_REF_NAME}."
          echo "Set APP_AURA_SYNC_IMAGE_TAG to ${GITHUB_REF_NAME#v} in aura-sync/exports.sh."
          echo "Pin image digests before submitting to the official Umbrel App Store."
