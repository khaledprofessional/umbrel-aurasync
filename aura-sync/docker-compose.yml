services:
  # ---------------------------------------------------------------------------
  # Hardware controller
  #
  # OpenRGB is the only service that touches raw hardware. It is privileged
  # because SMBus (DDR4/DDR5 RGB), USB HID (fans, AIOs, GPU logos), and some
  # motherboard Super I/O controllers cannot be reached through a narrow,
  # portable device allow-list: bus numbers differ on every machine.
  # ---------------------------------------------------------------------------
  openrgb:
    image: ttl.sh/aurasync-openrgb-khaled:24h
    restart: unless-stopped
    privileged: true
    init: true
    environment:
      TZ: ${TZ:-Etc/UTC}
      OPENRGB_SERVER_PORT: "6742"
      OPENRGB_CONFIG_DIR: /config
      HOME: /config
      QT_QPA_PLATFORM: offscreen
    volumes:
      - ${APP_DATA_DIR}/data/openrgb:/config
      - /dev:/dev
      # Read-only host views. OpenRGB itself reads sysfs; the mounted modules
      # directory lets the entrypoint attempt `modprobe i2c-dev` on the host.
      - /sys:/sys:ro
      - /proc:/proc:ro
      - /lib/modules:/lib/modules:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6742 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # AuraSync API, telemetry collector, LED renderer, and webhook receiver
  # ---------------------------------------------------------------------------
  backend:
    image: ttl.sh/aurasync-backend-khaled-v3:24h
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      openrgb:
        condition: service_started
    environment:
      TZ: ${TZ:-Etc/UTC}
      DATA_DIR: /data
      OPENRGB_HOST: openrgb
      OPENRGB_PORT: "6742"
      OPENRGB_CLIENT_NAME: AuraSync
      HOST_ROOT: /host/root
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_OS_RELEASE: /host/root/etc/os-release
      AURASYNC_WEBHOOK_TOKEN: ${APP_AURA_SYNC_WEBHOOK_TOKEN:-}
      AURASYNC_LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      MALLOC_ARENA_MAX: "2"
      # Harmless on hosts without the NVIDIA runtime; when Umbrel grants GPU
      # access this exposes nvidia-smi and libnvidia-ml for GPU telemetry.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
    volumes:
      - ${APP_DATA_DIR}/data/backend:/data
      # Host telemetry and a read-only view of the file system for storage
      # gauges. The UI only accepts absolute paths that resolve inside this
      # mount; nothing here is writable.
      - /:/host/root:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Static dashboard + same-origin API proxy
  # ---------------------------------------------------------------------------
  web:
    image: ttl.sh/aurasync-web-khaled-v3:24h
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=8m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # umbrelOS 2.x routes the app port through app_proxy. This service has no
  # image of its own; the environment block is read by the platform.
  app_proxy:
    environment:
      APP_HOST: aura-sync_web_1
      APP_PORT: 8080
      # External integrations cannot present an Umbrel session cookie. Only
      # the token-protected webhook route is public; everything else remains
      # behind the owner's Umbrel login.
      PROXY_AUTH_WHITELIST: "/api/webhook/*"
